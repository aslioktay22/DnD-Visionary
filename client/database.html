<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&amp;Database · D&amp;D: Visionary</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="page-database">

  <!-- HEADER (title changes with the API) -->
  <header class="site-header">
    <h1 class="logo db-title" id="view-title" data-text="D&amp;Database" tabindex="-1">D&amp;Database</h1>

    <nav class="site-nav" aria-label="Database">
      <button type="button" class="pill" id="btn-back" hidden>Back</button>
      <button type="button" class="pill" id="btn-top" hidden>Return to Top</button>
      <a href="main.html" class="pill">Dashboard</a>
    </nav>
  </header>

  <!-- SEARCH -->
  <form class="db-search" id="search-form" role="search">
    <label for="search-input" class="visually-hidden">Search the database</label>
    <input type="search" id="search-input" class="input"
           placeholder="Enter keywords..." autocomplete="off" spellcheck="false">
    <button type="submit" class="db-tile db-search-btn">Search</button>
  </form>

  <!-- CONTENT from js/database.js -->
  <main class="db-content" id="db-content">
    <p class="db-status" id="db-status" aria-live="polite">Loading…</p>
    <div id="db-view"></div>
  </main>

<script src="js/database.js"></script>

</body>
</html>
