<!DOCTYPE html>
<html lang="en">
  <head>
      <link rel="stylesheet" href="css/index.css">
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>DnD Visionary Login</title>
  </head>
  <body>
    <h2 id="welcome">Welcome to D&D: VISIONARY</h2>
    <h3 id="loginRegister">Enter your info...</h3>
    <div class="login">
      <input type="text" id="loginUsername" placeholder="Username">
      <input type="password" id="loginPassword" placeholder="Password">
    </div>
    <h3 id="loginRegister">Or sign up today!</h3>
    <div class="register">
      <input type="text" id="registerName" placeholder="Name">
      <input type="text" id="registerUsername" placeholder="Username">
      <input type="password" id="registerPassword" placeholder="Password">
    </div>
    <div class="button">
      <button type="button" onclick="submitForm()">Let's Go!</button>
    </div>
    <script src="js/index.js"></script>
  </body>
</html>
